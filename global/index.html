<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth & Moon</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
    }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.z = 10; // moved back to view more content

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const textureLoader = new THREE.TextureLoader();

// 🌍 Texture Trái Đất (màu tự nhiên)
const earthTexture = textureLoader.load(
    "https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg"
);

const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
const earthMaterial = new THREE.MeshStandardMaterial({
    map: earthTexture
});

const earth = new THREE.Mesh(earthGeometry, earthMaterial);
scene.add(earth);

// 🌙 Tạo Texture Mặt Trăng màu xám bằng Canvas
function createMoonTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    // Vẽ nền xám
    ctx.fillStyle = '#a0a0a0';
    ctx.fillRect(0, 0, 1024, 1024);
    
    // Vẽ hàng chục miệng hố nhỏ
    ctx.fillStyle = '#505050';
    for (let i = 0; i < 80; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = 5 + Math.random() * 15; // bán kính nhỏ
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

const moonTexture = createMoonTexture();  

const moonGeometry = new THREE.SphereGeometry(0.27, 32, 32);
const moonMaterial = new THREE.MeshStandardMaterial({
    map: moonTexture
});

const moon = new THREE.Mesh(moonGeometry, moonMaterial);

// Group để quay quanh Trái Đất
const moonOrbit = new THREE.Object3D();
scene.add(moonOrbit);
moonOrbit.add(moon);

// đặt vị trí ban đầu của mặt trăng
moon.position.x = 2.5;

// 📝 Hiển thị chữ chào bằng sprite
function createTextSprite(message) {
    const canvas = document.createElement('canvas');
    canvas.width = 2048;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Vẽ nền trong suốt
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.font = 'Bold 100px "Courier New", monospace';
    ctx.fillStyle = '#00d4ff';
    ctx.strokeStyle = '#0088cc';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(message, canvas.width / 2, canvas.height / 2);
    ctx.fillText(message, canvas.width / 2, canvas.height / 2);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(4, 1, 1);
    return sprite;
}

const helloSprite = createTextSprite('Hello everyone, my name is Khiem!');
helloSprite.position.set(0, 2.5, 2);
scene.add(helloSprite);

// Ánh sáng
const light = new THREE.PointLight(0xffffff, 1.5);
light.position.set(5, 3, 5);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0x404040);
scene.add(ambientLight);

// ⭐ Sao nền
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 3000;
const positions = [];

for (let i = 0; i < starsCount; i++) {
    positions.push(
        (Math.random() - 0.5) * 2000,
        (Math.random() - 0.5) * 2000,
        (Math.random() - 0.5) * 2000
    );
}

starsGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
);

const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff });
const stars = new THREE.Points(starsGeometry, starsMaterial);
scene.add(stars);

// 🖱 Điều khiển xoay 360°
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enableZoom = true;

// Resize
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 🎬 Animation
function animate() {
    requestAnimationFrame(animate);

    earth.rotation.y += 0.002;        // Trái Đất tự quay
    moonOrbit.rotation.y += 0.01;     // Mặt Trăng quay quanh Trái Đất
    moon.rotation.y += 0.01;          // Mặt Trăng tự quay

    controls.update();
    renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
